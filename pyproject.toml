[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-ml"
version = "0.1.0"
description = "Synthetic, interpretable machine-condition anomaly baseline"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Bastien DFD"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
